<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DRG APPCare">
  <rect width="64" height="64" rx="15" fill="#ffffff"/>
  <defs>
    <linearGradient id="cHeart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86e6"/>
      <stop offset="0.55" stop-color="#0d4a9c"/>
      <stop offset="1" stop-color="#07295a"/>
    </linearGradient>
  </defs>
  <!-- Coracao: le como cuidado ja em 16px, e nao colide com os irmaos
       (Check=visto, Pulse=linha de ECG, Energy=raio, Hidro=gota). -->
  <path d="M32 52 C32 52 11.5 38.5 11.5 26.5 A10.25 10.25 0 0 1 32 21.5
           A10.25 10.25 0 0 1 52.5 26.5 C52.5 38.5 32 52 32 52 Z"
        fill="url(#cHeart)" stroke="#06213f" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cruz: diz saude sem virar desenho detalhado que some no favicon. -->
  <rect x="29.2" y="24.6" width="5.6" height="15.8" rx="1.6" fill="#ffffff"/>
  <rect x="24.3" y="29.7" width="15.4" height="5.6" rx="1.6" fill="#ffffff"/>
</svg>
